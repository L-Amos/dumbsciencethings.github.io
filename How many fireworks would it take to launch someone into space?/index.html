<head>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
  <link href="style.css" rel="stylesheet">
  <script src="script.js"></script>
</head>

<container class="main">
  <h1>How Many Fireworks?</h1>

  <form name="firework_calc" onsubmit="calc();return false">
    Weight: <input name="weight"></input>
    Height: <input name="height"></input>
    <input type=submit></input><br /> <br />
    <input name="mortar_weight" type="range" oninput="calc_num()" disabled><p style="text-align:center">Mortar Weight<p>
  </form>
  <label id="answer">Enter some numbers and see the answer!</label>

  <h1>How High?</h1>

  <form name="height_calc" onsubmit="calc2();return false">
    Weight: <input name="weight">
    Number of Fireworks: <input name="num_fireworks">
    <input type=submit></input><br /> <br />
    <input name="mortar_weight" type="range" oninput="calc2()" min="0.01" max="1.01" step="0.1"><p style="text-align:center">Mortar Weight<p>
  </form>
  <label id="answer2">Enter some numbers and see the answer!</label>
</container>
